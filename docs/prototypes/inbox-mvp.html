<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traceability · Inbox MVP</title>
    <script src="https://unpkg.com/lucide@0.475.0/dist/umd/lucide.js"></script>
    <style>
      :root {
        color-scheme: light;
        --canvas: #f6f6f7;
        --surface-1: #ffffff;
        --surface-2: #fbfbfc;
        --surface-3: #f1f1f3;
        --hairline: rgba(10, 10, 12, 0.09);
        --hairline-strong: rgba(10, 10, 12, 0.16);
        --ink: #1a1a1f;
        --muted: #4a4b52;
        --subtle: #66676e;
        --tertiary: #7c7d85;
        --primary: #5b67d4;
        --primary-hover: #4a55bd;
        --primary-soft: rgba(91, 103, 212, 0.11);
        --info: #2f7bc9;
        --success: #2f9e54;
        --warning: #a97b1c;
        --danger: #cf3f3f;
        --glass: rgba(255, 255, 255, 0.82);
        --glass-elevated: rgba(255, 255, 255, 0.96);
        --overlay: rgba(0, 0, 0, 0.035);
        --overlay-strong: rgba(0, 0, 0, 0.07);
        --code-bg: #f2f2f4;
        --shadow: 0 18px 50px rgba(24, 24, 28, 0.12);
        --font-sans: Inter, "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
        --agent-share: 37%;
      }

      .dark {
        color-scheme: dark;
        --canvas: #090a0c;
        --surface-1: #101115;
        --surface-2: #14151a;
        --surface-3: #1a1b21;
        --hairline: rgba(255, 255, 255, 0.08);
        --hairline-strong: rgba(255, 255, 255, 0.14);
        --ink: #f5f5f7;
        --muted: #b6b7bc;
        --subtle: #9a9ba3;
        --tertiary: #808189;
        --primary: #8f9cff;
        --primary-hover: #aeb7ff;
        --primary-soft: rgba(143, 156, 255, 0.12);
        --info: #6db9ff;
        --success: #58c77b;
        --warning: #e4b55a;
        --danger: #f17c7c;
        --glass: rgba(16, 17, 21, 0.86);
        --glass-elevated: rgba(28, 29, 35, 0.96);
        --overlay: rgba(255, 255, 255, 0.04);
        --overlay-strong: rgba(255, 255, 255, 0.08);
        --code-bg: #090a0b;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.38);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--canvas);
        color: var(--ink);
        font-family: var(--font-sans);
        font-size: 13px;
        line-height: 1.45;
        letter-spacing: -0.01em;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button {
        color: inherit;
        cursor: pointer;
      }

      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      .icon {
        width: 15px;
        height: 15px;
        stroke-width: 1.8;
      }

      .titlebar {
        position: fixed;
        inset: 0 0 auto 0;
        z-index: 30;
        display: flex;
        height: 30px;
        align-items: center;
        gap: 7px;
        border-bottom: 1px solid var(--hairline);
        background: var(--glass);
        padding: 0 14px 0 84px;
        color: var(--tertiary);
        backdrop-filter: blur(20px);
        user-select: none;
      }

      .titlebar .brand-mark {
        color: var(--primary-hover);
      }

      .titlebar strong {
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
      }

      .titlebar-note {
        margin-left: auto;
        font-size: 10px;
      }

      .app-shell {
        display: flex;
        width: 100%;
        height: 100%;
        padding-top: 30px;
      }

      .sidebar {
        position: relative;
        z-index: 20;
        display: flex;
        width: 52px;
        flex: 0 0 52px;
        flex-direction: column;
        align-items: center;
        border-right: 1px solid var(--hairline);
        background: var(--glass);
        padding: 10px 8px 12px;
        backdrop-filter: blur(24px);
      }

      .sidebar-brand {
        display: grid;
        width: 32px;
        height: 28px;
        place-items: center;
        color: var(--primary-hover);
      }

      .sidebar-nav {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 8px;
        padding-top: 14px;
      }

      .nav-icon,
      .theme-button,
      .icon-button {
        position: relative;
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border: 1px solid var(--hairline);
        border-radius: 8px;
        background: var(--overlay);
        color: var(--muted);
        transition: 150ms ease;
      }

      .nav-icon:hover,
      .theme-button:hover,
      .icon-button:hover {
        border-color: var(--hairline-strong);
        background: var(--overlay-strong);
        color: var(--ink);
      }

      .nav-icon.active {
        border-color: var(--hairline-strong);
        background: var(--overlay-strong);
        color: var(--primary-hover);
      }

      .nav-icon .count {
        position: absolute;
        top: -5px;
        right: -5px;
        min-width: 16px;
        height: 16px;
        border: 2px solid var(--glass-elevated);
        border-radius: 999px;
        background: var(--danger);
        color: white;
        font-size: 8px;
        font-weight: 700;
        line-height: 12px;
        text-align: center;
      }

      .sidebar-footer {
        width: 100%;
        border-top: 1px solid var(--hairline);
        padding-top: 10px;
      }

      .main-region {
        display: grid;
        min-width: 0;
        flex: 1;
        grid-template-columns: minmax(0, calc(100% - var(--agent-share))) 1px minmax(348px, var(--agent-share));
        overflow: hidden;
      }

      .main-region.expanded {
        grid-template-columns: minmax(0, 1fr) 0 0;
      }

      .main-region.expanded .agent-panel,
      .main-region.expanded .splitter {
        visibility: hidden;
      }

      .content-panel {
        display: flex;
        min-width: 0;
        flex-direction: column;
        overflow: hidden;
      }

      .workspace-header {
        display: flex;
        height: 48px;
        flex: 0 0 48px;
        align-items: center;
        gap: 10px;
        border-bottom: 1px solid var(--hairline);
        background: var(--glass);
        padding: 0 18px;
        backdrop-filter: blur(20px);
      }

      .breadcrumbs {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 7px;
        color: var(--tertiary);
        font-size: 11px;
      }

      .breadcrumbs .project {
        color: var(--muted);
        font-weight: 650;
      }

      .breadcrumbs .current {
        color: var(--ink);
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
      }

      .live-status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--tertiary);
        font-size: 10px;
      }

      .live-dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--success);
      }

      .header-actions .icon-button {
        width: 30px;
        height: 30px;
      }

      .splitter {
        position: relative;
        z-index: 5;
        width: 1px;
        background: var(--hairline);
      }

      .inbox-workspace {
        display: grid;
        min-height: 0;
        flex: 1;
        grid-template-columns: 286px minmax(0, 1fr);
        overflow: hidden;
      }

      .queue-panel {
        display: flex;
        min-width: 0;
        flex-direction: column;
        border-right: 1px solid var(--hairline);
        background: var(--surface-2);
      }

      .queue-heading {
        padding: 17px 14px 12px;
      }

      .queue-title-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .queue-title-row h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 680;
        letter-spacing: -0.03em;
      }

      .queue-title-row .total {
        display: inline-grid;
        min-width: 20px;
        height: 20px;
        place-items: center;
        border: 1px solid var(--hairline);
        border-radius: 999px;
        background: var(--overlay);
        color: var(--tertiary);
        font-size: 9px;
        font-weight: 650;
      }

      .queue-heading p {
        margin: 4px 0 0;
        color: var(--tertiary);
        font-size: 10px;
      }

      .search-box {
        display: flex;
        height: 34px;
        align-items: center;
        gap: 7px;
        margin: 0 12px 10px;
        border: 1px solid var(--hairline);
        border-radius: 9px;
        background: var(--surface-1);
        padding: 0 10px;
        color: var(--tertiary);
        transition: 150ms ease;
      }

      .search-box:focus-within {
        border-color: color-mix(in srgb, var(--primary) 55%, transparent);
        box-shadow: 0 0 0 3px var(--primary-soft);
      }

      .search-box input {
        min-width: 0;
        flex: 1;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
        font-size: 11px;
      }

      .search-box input::placeholder {
        color: var(--tertiary);
      }

      .queue-tabs {
        display: flex;
        gap: 2px;
        overflow-x: auto;
        border-bottom: 1px solid var(--hairline);
        padding: 0 6px 9px;
        scrollbar-width: none;
      }

      .queue-tab {
        display: inline-flex;
        height: 27px;
        flex: 0 0 auto;
        align-items: center;
        gap: 5px;
        border: 1px solid transparent;
        border-radius: 7px;
        background: transparent;
        padding: 0 6px;
        color: var(--tertiary);
        font-size: 9px;
      }

      .queue-tab:hover {
        background: var(--overlay);
        color: var(--muted);
      }

      .queue-tab.active {
        border-color: var(--hairline);
        background: var(--surface-1);
        color: var(--ink);
        font-weight: 620;
      }

      .queue-tab span {
        color: var(--tertiary);
        font-size: 9px;
        font-variant-numeric: tabular-nums;
      }

      .queue-list {
        min-height: 0;
        flex: 1;
        overflow: auto;
        padding: 6px;
      }

      .queue-item {
        display: grid;
        width: 100%;
        grid-template-columns: 9px minmax(0, 1fr);
        gap: 9px;
        border: 1px solid transparent;
        border-radius: 9px;
        background: transparent;
        padding: 10px 9px;
        text-align: left;
        transition: 130ms ease;
      }

      .queue-item + .queue-item {
        margin-top: 2px;
      }

      .queue-item:hover {
        background: var(--overlay);
      }

      .queue-item.active {
        border-color: var(--hairline-strong);
        background: var(--surface-1);
        box-shadow: 0 8px 24px rgba(20, 20, 25, 0.05);
      }

      .priority-dot {
        width: 8px;
        height: 8px;
        margin-top: 5px;
        border-radius: 999px;
        background: var(--danger);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 12%, transparent);
      }

      .priority-dot.warning {
        background: var(--warning);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--warning) 12%, transparent);
      }

      .priority-dot.muted {
        background: var(--tertiary);
        box-shadow: none;
      }

      .item-copy {
        min-width: 0;
      }

      .item-title {
        display: -webkit-box;
        overflow: hidden;
        color: var(--ink);
        font-size: 11px;
        font-weight: 620;
        line-height: 1.42;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .item-meta,
      .item-footer {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 6px;
        color: var(--tertiary);
        font-size: 9px;
      }

      .item-meta {
        margin-top: 5px;
        font-family: var(--font-mono);
      }

      .item-meta span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .item-footer {
        margin-top: 7px;
      }

      .item-footer .time {
        margin-left: auto;
        white-space: nowrap;
      }

      .mini-state {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .mini-state .state-dot {
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: currentColor;
      }

      .mini-state.investigating {
        color: var(--primary-hover);
      }

      .mini-state.done {
        color: var(--success);
      }

      .queue-empty {
        display: grid;
        min-height: 180px;
        place-items: center;
        padding: 24px;
        color: var(--tertiary);
        font-size: 11px;
        text-align: center;
      }

      .detail-panel {
        min-width: 0;
        overflow: auto;
        background: var(--canvas);
      }

      .detail-page {
        width: 100%;
        max-width: 780px;
        margin: 0 auto;
        padding: 18px 20px 48px;
      }

      .detail-kicker {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--primary-hover);
        font-size: 9px;
        font-weight: 720;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .detail-kicker .priority {
        border: 1px solid color-mix(in srgb, var(--danger) 28%, transparent);
        border-radius: 999px;
        background: color-mix(in srgb, var(--danger) 8%, transparent);
        padding: 2px 6px;
        color: var(--danger);
        letter-spacing: 0;
      }

      .detail-title {
        margin: 6px 0 0;
        color: var(--ink);
        font-size: clamp(18px, 2.1vw, 23px);
        font-weight: 690;
        letter-spacing: -0.045em;
        line-height: 1.16;
      }

      .detail-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        margin-top: 8px;
        color: var(--tertiary);
        font: 9px var(--font-mono);
      }

      .detail-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 14px;
      }

      .primary-button,
      .secondary-button,
      .quiet-button,
      .status-button {
        display: inline-flex;
        height: 32px;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 1px solid var(--hairline);
        border-radius: 9px;
        background: var(--surface-1);
        padding: 0 11px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 600;
        transition: 140ms ease;
      }

      .primary-button {
        border-color: color-mix(in srgb, var(--primary) 45%, transparent);
        background: var(--primary);
        color: white;
      }

      .dark .primary-button {
        color: #111329;
      }

      .primary-button:hover {
        background: var(--primary-hover);
      }

      .secondary-button:hover,
      .quiet-button:hover,
      .status-button:hover {
        border-color: var(--hairline-strong);
        background: var(--overlay-strong);
        color: var(--ink);
      }

      .quiet-button {
        background: transparent;
      }

      .secondary-button.danger:hover {
        border-color: color-mix(in srgb, var(--danger) 45%, transparent);
        color: var(--danger);
      }

      .module {
        overflow: hidden;
        margin-top: 14px;
        border: 1px solid var(--hairline);
        border-radius: 14px;
        background: var(--glass);
      }

      .module-header {
        display: flex;
        min-height: 44px;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid var(--hairline);
        padding: 9px 12px;
      }

      .module-title {
        color: var(--ink);
        font-size: 11px;
        font-weight: 650;
      }

      .module-subtitle {
        overflow: hidden;
        color: var(--tertiary);
        font-size: 9px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .module-actions {
        margin-left: auto;
      }

      .badge {
        display: inline-flex;
        height: 22px;
        align-items: center;
        gap: 5px;
        border: 1px solid var(--hairline);
        border-radius: 999px;
        background: var(--overlay);
        padding: 0 8px;
        color: var(--muted);
        font-size: 9px;
        font-weight: 630;
        white-space: nowrap;
      }

      .badge::before {
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: currentColor;
        content: "";
      }

      .badge.open {
        color: var(--danger);
      }

      .badge.investigating {
        color: var(--primary-hover);
      }

      .badge.done {
        color: var(--success);
      }

      .badge.dismissed {
        color: var(--tertiary);
      }

      .why-card {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        gap: 10px;
        padding: 12px;
      }

      .why-icon {
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        border: 1px solid color-mix(in srgb, var(--warning) 24%, transparent);
        border-radius: 8px;
        background: color-mix(in srgb, var(--warning) 8%, transparent);
        color: var(--warning);
      }

      .why-card strong {
        display: block;
        color: var(--ink);
        font-size: 10px;
        font-weight: 650;
      }

      .why-card p {
        margin: 3px 0 0;
        color: var(--subtle);
        font-size: 10px;
        line-height: 1.55;
      }

      .brief-empty {
        padding: 22px 16px;
        text-align: center;
      }

      .brief-empty .empty-icon {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        margin: 0 auto 9px;
        border: 1px solid var(--hairline);
        border-radius: 10px;
        background: var(--overlay);
        color: var(--primary-hover);
      }

      .brief-empty strong {
        display: block;
        color: var(--ink);
        font-size: 11px;
      }

      .brief-empty p {
        max-width: 360px;
        margin: 4px auto 11px;
        color: var(--tertiary);
        font-size: 10px;
      }

      .brief-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .brief-cell {
        min-width: 0;
        padding: 12px;
      }

      .brief-cell + .brief-cell {
        border-left: 1px solid var(--hairline);
      }

      .data-label {
        color: var(--tertiary);
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .brief-cell p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.55;
      }

      .fact-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .fact {
        min-width: 0;
        padding: 11px 12px;
      }

      .fact + .fact {
        border-left: 1px solid var(--hairline);
      }

      .data-value {
        overflow: hidden;
        margin-top: 5px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .activity-list {
        padding: 4px 12px;
      }

      .activity-row {
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        min-height: 38px;
        border-bottom: 1px solid var(--hairline);
        color: var(--muted);
        font-size: 9px;
      }

      .activity-row:last-child {
        border-bottom: 0;
      }

      .activity-icon {
        display: grid;
        width: 18px;
        height: 18px;
        place-items: center;
        border-radius: 6px;
        background: var(--overlay);
        color: var(--tertiary);
      }

      .activity-icon .icon {
        width: 11px;
        height: 11px;
      }

      .activity-time {
        color: var(--tertiary);
        white-space: nowrap;
      }

      .agent-panel {
        display: flex;
        min-width: 0;
        flex-direction: column;
        overflow: hidden;
        background: var(--glass);
        backdrop-filter: blur(24px);
      }

      .agent-header {
        display: flex;
        min-height: 48px;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid var(--hairline);
        padding: 0 10px;
      }

      .agent-brand {
        display: grid;
        width: 28px;
        height: 28px;
        flex: 0 0 28px;
        place-items: center;
        border: 1px solid color-mix(in srgb, var(--primary) 22%, transparent);
        border-radius: 8px;
        background: var(--primary-soft);
        color: var(--primary-hover);
      }

      .agent-title {
        min-width: 0;
        flex: 1;
      }

      .agent-title strong {
        display: block;
        overflow: hidden;
        color: var(--ink);
        font-size: 11px;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .agent-subtitle {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-top: 2px;
        color: var(--tertiary);
        font-size: 9px;
      }

      .agent-subtitle .dot {
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: var(--tertiary);
      }

      .agent-subtitle.running .dot {
        background: var(--primary);
        animation: pulse 1.25s ease infinite;
      }

      .agent-body {
        min-height: 0;
        flex: 1;
        overflow: auto;
        padding: 14px 14px 22px;
      }

      .context-card {
        display: grid;
        grid-template-columns: 26px minmax(0, 1fr);
        gap: 9px;
        border: 1px solid var(--hairline);
        border-radius: 10px;
        background: var(--overlay);
        padding: 10px;
      }

      .context-card .context-icon {
        display: grid;
        width: 26px;
        height: 26px;
        place-items: center;
        border-radius: 7px;
        background: var(--surface-1);
        color: var(--primary-hover);
      }

      .context-card strong {
        display: block;
        overflow: hidden;
        color: var(--ink);
        font-size: 10px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .context-card span {
        display: block;
        margin-top: 2px;
        color: var(--tertiary);
        font: 8px var(--font-mono);
      }

      .agent-empty {
        display: grid;
        min-height: 300px;
        place-items: center;
        padding: 32px 20px;
        text-align: center;
      }

      .agent-empty-mark {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        margin: 0 auto 11px;
        border: 1px solid var(--hairline);
        border-radius: 12px;
        background: var(--overlay);
        color: var(--primary-hover);
      }

      .agent-empty strong {
        display: block;
        color: var(--ink);
        font-size: 12px;
      }

      .agent-empty p {
        max-width: 330px;
        margin: 5px auto 12px;
        color: var(--tertiary);
        font-size: 10px;
        line-height: 1.55;
      }

      .suggestion-list {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
      }

      .suggestion {
        border: 1px solid var(--hairline);
        border-radius: 8px;
        background: var(--surface-1);
        padding: 6px 8px;
        color: var(--muted);
        font-size: 9px;
      }

      .suggestion:hover {
        border-color: var(--hairline-strong);
        background: var(--overlay-strong);
      }

      .message {
        margin-top: 14px;
      }

      .message.user {
        display: flex;
        justify-content: flex-end;
      }

      .user-bubble {
        max-width: 88%;
        border-radius: 11px 11px 3px 11px;
        background: var(--primary-soft);
        padding: 9px 11px;
        color: var(--ink);
        font-size: 10px;
      }

      .assistant-copy {
        color: var(--muted);
        font-size: 10px;
        line-height: 1.6;
      }

      .assistant-copy strong {
        color: var(--ink);
        font-weight: 650;
      }

      .assistant-copy p {
        margin: 0 0 8px;
      }

      .agent-step {
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr);
        gap: 7px;
        align-items: center;
        min-height: 36px;
        border-top: 1px solid var(--hairline);
        color: var(--tertiary);
        font-size: 9px;
      }

      .agent-step .icon {
        width: 12px;
        height: 12px;
      }

      .agent-step.running .icon {
        color: var(--primary-hover);
        animation: spin 1s linear infinite;
      }

      .agent-step.done .icon {
        color: var(--success);
      }

      .agent-result {
        margin-top: 13px;
        border: 1px solid var(--hairline);
        border-radius: 10px;
        background: var(--overlay);
        padding: 11px;
      }

      .agent-result .result-label {
        color: var(--primary-hover);
        font-size: 8px;
        font-weight: 720;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .agent-result p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.58;
      }

      .agent-composer {
        flex: 0 0 auto;
        border-top: 1px solid var(--hairline);
        background: var(--glass-elevated);
        padding: 8px 10px 10px;
      }

      .composer-box {
        overflow: hidden;
        border: 1px solid var(--hairline-strong);
        border-radius: 11px;
        background: var(--overlay);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
      }

      .composer-box:focus-within {
        border-color: color-mix(in srgb, var(--primary) 55%, transparent);
        box-shadow: 0 0 0 3px var(--primary-soft);
      }

      .composer-box textarea {
        display: block;
        width: 100%;
        min-height: 54px;
        resize: none;
        border: 0;
        outline: 0;
        background: transparent;
        padding: 9px 10px 5px;
        color: var(--ink);
        font-size: 10px;
      }

      .composer-box textarea::placeholder {
        color: var(--tertiary);
      }

      .composer-actions {
        display: flex;
        align-items: center;
        border-top: 1px solid var(--hairline);
        padding: 5px 6px;
      }

      .model-pill {
        border: 1px solid var(--hairline);
        border-radius: 6px;
        background: var(--surface-1);
        padding: 3px 6px;
        color: var(--tertiary);
        font-size: 8px;
      }

      .send-button {
        display: grid;
        width: 26px;
        height: 26px;
        place-items: center;
        margin-left: auto;
        border: 0;
        border-radius: 8px;
        background: var(--ink);
        color: var(--canvas);
      }

      .send-button:hover {
        opacity: 0.82;
      }

      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 80;
        display: flex;
        max-width: 340px;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--hairline-strong);
        border-radius: 9px;
        background: var(--glass-elevated);
        padding: 9px 11px;
        color: var(--muted);
        box-shadow: var(--shadow);
        font-size: 10px;
        opacity: 0;
        pointer-events: none;
        transform: translateY(8px);
        transition: 180ms ease;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      .floating-agent {
        display: none;
      }

      .mobile-close {
        display: none;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @media (max-width: 1120px) {
        :root {
          --agent-share: 39%;
        }

        .inbox-workspace {
          grid-template-columns: 264px minmax(0, 1fr);
        }

        .brief-grid {
          grid-template-columns: 1fr;
        }

        .brief-cell + .brief-cell {
          border-top: 1px solid var(--hairline);
          border-left: 0;
        }

        .fact-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .fact:nth-child(3) {
          border-top: 1px solid var(--hairline);
          border-left: 0;
        }

        .fact:nth-child(4) {
          border-top: 1px solid var(--hairline);
        }
      }

      @media (max-width: 940px) {
        .main-region {
          grid-template-columns: minmax(0, 1fr);
        }

        .agent-panel,
        .splitter {
          display: none;
        }

        .agent-panel.mobile-open {
          position: fixed;
          inset: 44px 14px 14px auto;
          z-index: 70;
          display: flex;
          width: min(390px, calc(100vw - 28px));
          border: 1px solid var(--hairline-strong);
          border-radius: 14px;
          background: var(--glass-elevated);
          box-shadow: var(--shadow);
        }

        .mobile-close {
          display: grid;
        }

        .floating-agent {
          position: fixed;
          right: 18px;
          bottom: 18px;
          z-index: 60;
          display: grid;
          width: 46px;
          height: 46px;
          place-items: center;
          border: 1px solid color-mix(in srgb, var(--primary) 35%, transparent);
          border-radius: 14px;
          background: var(--glass-elevated);
          color: var(--primary-hover);
          box-shadow: var(--shadow);
        }
      }

      @media (max-width: 680px) {
        .titlebar {
          padding-left: 14px;
        }

        .titlebar-note,
        .live-status {
          display: none;
        }

        .sidebar {
          display: none;
        }

        .inbox-workspace {
          grid-template-columns: 1fr;
        }

        .queue-panel {
          border-right: 0;
        }

        .detail-panel {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="titlebar">
      <i data-lucide="fingerprint" class="icon brand-mark"></i>
      <strong>Traceability</strong>
      <span class="titlebar-note">Inbox MVP · interactive prototype</span>

    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <div class="sidebar-brand" title="Traceability">

          <button class="nav-icon" type="button" title="Explorer" aria-label="Explorer">

      </aside>

      <main class="main-region" id="mainRegion">
        <section class="content-panel" aria-label="Inbox workspace">
          <header class="workspace-header">
            <nav class="breadcrumbs" aria-label="Breadcrumb">
              <span class="project">Web Demo</span>
              <i data-lucide="chevron-right" class="icon" style="width: 11px"></i>
              <span class="current">Inbox</span>
            </nav>
            <div class="header-actions">
              <span class="live-status"><span class="live-dot"></span>Live updates</span>
              <button class="icon-button" id="refreshButton" type="button" title="Refresh inbox" aria-label="Refresh inbox">
                <i data-lucide="refresh-cw" class="icon" id="refreshIcon"></i>
              </button>
              <button class="icon-button" id="expandButton" type="button" title="Maximize content" aria-label="Maximize content" aria-pressed="false">
                <i data-lucide="maximize-2" class="icon" id="expandIcon"></i>
              </button>
            </div>
          </header>

          <div class="inbox-workspace">
            <aside class="queue-panel" aria-label="Inbox queue">
              <div class="queue-heading">
                <div class="queue-title-row">
                  <h1>Inbox</h1>
                  <span class="total" id="queueTotal">4</span>
                </div>
                <p>Issues that need a decision.</p>
              </div>
              <label class="search-box">
                <i data-lucide="search" class="icon"></i>
                <input type="search" id="queueSearch" placeholder="Search inbox" autocomplete="off" />
              </label>
              <div class="queue-tabs" role="tablist" aria-label="Inbox status">
                <button class="queue-tab active" data-filter="active" type="button" role="tab">Open <span id="activeCount">4</span></button>
                <button class="queue-tab" data-filter="investigating" type="button" role="tab">Investigating <span id="investigatingCount">1</span></button>
                <button class="queue-tab" data-filter="done" type="button" role="tab">Done <span id="doneCount">1</span></button>
                <button class="queue-tab" data-filter="dismissed" type="button" role="tab">Dismissed <span id="dismissedCount">1</span></button>
              </div>
              <div class="queue-list" id="queueList"></div>
            </aside>

            <section class="detail-panel" aria-label="Selected inbox item">
              <div class="detail-page" id="detailPage"></div>
            </section>
          </div>
        </section>

        <div class="splitter" role="separator" aria-label="Content and Agent panels"></div>

        <aside class="agent-panel" aria-label="Traceability Agent">
          <div class="agent-header">
            <span class="agent-brand"><i data-lucide="sparkles" class="icon"></i></span>
            <div class="agent-title">
              <strong id="agentTitle">Inbox investigation</strong>
              <span class="agent-subtitle" id="agentSubtitle"><span class="dot"></span><span>Context ready</span></span>
            </div>
            <button class="icon-button" type="button" title="New conversation" aria-label="New conversation" id="newConversationButton">
              <i data-lucide="square-pen" class="icon"></i>
            </button>
            <button class="icon-button mobile-close" type="button" title="Close Agent" aria-label="Close Agent" id="closeMobileAgentButton">
              <i data-lucide="x" class="icon"></i>
            </button>
          </div>
          <div class="agent-body" id="agentBody"></div>
          <div class="agent-composer">
            <div class="composer-box">
              <textarea id="agentInput" aria-label="Message Agent" placeholder="Ask about the selected issue…"></textarea>
              <div class="composer-actions">
                <span class="model-pill">gpt-5.6</span>
                <button class="send-button" type="button" aria-label="Send message" id="sendButton">
                  <i data-lucide="arrow-up" class="icon"></i>
                </button>
              </div>
            </div>
          </div>
        </aside>
      </main>
    </div>

    <button class="floating-agent" id="floatingAgentButton" type="button" aria-label="Open Agent">
      <i data-lucide="sparkles" class="icon"></i>
    </button>
    <div class="toast" id="toast"><i data-lucide="check" class="icon"></i><span id="toastText">Updated</span></div>

    <script>
      var items = [
        {

          ]
        }
      ];

      var selectedId = "ISSUE-9F3A2E";
      var activeFilter = "active";
      var query = "";
      var toastTimer = null;

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function selectedItem() {
        return items.find(function (item) { return item.id === selectedId; }) || items[0];
      }

      function isActive(item) {
        return item.status === "open" || item.status === "investigating";
      }

      function filteredItems() {
        var normalized = query.trim().toLowerCase();
        return items.filter(function (item) {
          var matchesStatus = activeFilter === "active" ? isActive(item) : item.status === activeFilter;
          var haystack = (item.id + " " + item.title + " " + item.source).toLowerCase();
          return matchesStatus && (!normalized || haystack.includes(normalized));
        });
      }

      function stateLabel(status) {
        if (status === "investigating") return "Investigating";
        if (status === "done") return "Done";
        if (status === "dismissed") return "Dismissed";
        return "Open";
      }

      function stateIcon(status) {
        if (status === "investigating") return "sparkles";
        if (status === "done") return "check";
        if (status === "dismissed") return "circle-off";
        return "circle-dot";
      }

      function refreshIcons() {
        if (window.lucide) window.lucide.createIcons();
      }

      function renderCounts() {
        var active = items.filter(isActive).length;
        var investigating = items.filter(function (item) { return item.status === "investigating"; }).length;
        var done = items.filter(function (item) { return item.status === "done"; }).length;
        var dismissed = items.filter(function (item) { return item.status === "dismissed"; }).length;
        document.getElementById("sidebarCount").textContent = active;
        document.getElementById("queueTotal").textContent = active;
        document.getElementById("activeCount").textContent = active;
        document.getElementById("investigatingCount").textContent = investigating;
        document.getElementById("doneCount").textContent = done;
        document.getElementById("dismissedCount").textContent = dismissed;
      }

      function renderQueue() {
        var visible = filteredItems();
        var list = document.getElementById("queueList");
        if (!visible.length) {
          list.innerHTML = '<div class="queue-empty">No inbox items match this view.</div>';
          renderCounts();
          return;
        }

        list.innerHTML = visible.map(function (item) {
          var tone = item.priorityTone === "warning" ? "warning" : item.priorityTone === "muted" ? "muted" : "";
          return '<button class="queue-item ' + (item.id === selectedId ? "active" : "") + '" type="button" data-item-id="' + item.id + '">' +
            '<span class="priority-dot ' + tone + '"></span>' +
            '<span class="item-copy">' +
              '<span class="item-title">' + escapeHtml(item.title) + '</span>' +
              '<span class="item-meta"><span>' + item.id + '</span><span>·</span><span>' + escapeHtml(item.source) + '</span></span>' +
              '<span class="item-footer">' +
                '<span class="mini-state ' + item.status + '"><span class="state-dot"></span>' + stateLabel(item.status) + '</span>' +
                '<span>' + item.events + ' events</span>' +
                '<span class="time">' + item.lastSeen + '</span>' +
              '</span>' +
            '</span>' +
          '</button>';
        }).join("");

        list.querySelectorAll("[data-item-id]").forEach(function (button) {
          button.addEventListener("click", function () {
            selectedId = button.getAttribute("data-item-id");
            renderAll();
          });
        });
        renderCounts();
      }

      function actionButtons(item) {
        if (item.status === "done" || item.status === "dismissed") {
          return '<button class="secondary-button" type="button" data-action="reopen"><i data-lucide="circle-dot" class="icon"></i>Reopen</button>';
        }
        return '<button class="primary-button" type="button" data-action="investigate"><i data-lucide="sparkles" class="icon"></i>' +
          (item.status === "investigating" ? "Continue investigation" : "Investigate") + '</button>' +
          '<button class="secondary-button" type="button" data-action="resolve"><i data-lucide="check" class="icon"></i>Resolve</button>' +
          '<button class="quiet-button" type="button" data-action="dismiss"><i data-lucide="circle-off" class="icon"></i>Ignore</button>';
      }

      function briefContent(item) {
        if (!item.brief) {
          return '<div class="brief-empty">' +
            '<span class="empty-icon"><i data-lucide="sparkles" class="icon"></i></span>' +
            '<strong>No investigation summary yet</strong>' +
            '<p>Start an Agent investigation to produce a concise summary, hypothesis and next action.</p>' +
            '<button class="secondary-button" type="button" data-action="investigate"><i data-lucide="sparkles" class="icon"></i>Investigate with Agent</button>' +
          '</div>';
        }
        return '<div class="brief-grid">' +
          '<div class="brief-cell"><div class="data-label">Summary</div><p>' + escapeHtml(item.brief.summary) + '</p></div>' +
          '<div class="brief-cell"><div class="data-label">Hypothesis</div><p>' + escapeHtml(item.brief.hypothesis) + '</p></div>' +
          '<div class="brief-cell"><div class="data-label">Next action</div><p>' + escapeHtml(item.brief.nextAction) + '</p></div>' +
        '</div>';
      }

      function renderDetail() {
        var item = selectedItem();
        var activity = item.activity.map(function (entry) {
          return '<div class="activity-row">' +
            '<span class="activity-icon"><i data-lucide="' + entry.icon + '" class="icon"></i></span>' +
            '<span>' + escapeHtml(entry.text) + '</span>' +
            '<span class="activity-time">' + escapeHtml(entry.time) + '</span>' +
          '</div>';
        }).join("");

        document.getElementById("detailPage").innerHTML =
          '<div class="detail-kicker">Needs attention <span class="priority">' + item.priority + '</span></div>' +
          '<h1 class="detail-title">' + escapeHtml(item.title) + '</h1>' +
          '<div class="detail-meta"><span>' + item.id + '</span><span>' + escapeHtml(item.project) + '</span><span>last seen ' + item.lastSeen + '</span></div>' +
          '<div class="detail-actions">' + actionButtons(item) + '</div>' +
          '<section class="module">' +
            '<div class="module-header"><span class="module-title">Why this is in Inbox</span><span class="module-subtitle">The trigger that requires a decision</span><span class="module-actions"><span class="badge ' + item.status + '">' + stateLabel(item.status) + '</span></span></div>' +
            '<div class="why-card"><span class="why-icon"><i data-lucide="zap" class="icon"></i></span><div><strong>' + escapeHtml(item.why) + '</strong><p>Traceability grouped repeated events into one actionable work item so the team can investigate once.</p></div></div>' +
          '</section>' +
          '<section class="module">' +
            '<div class="module-header"><span class="module-title">Investigation brief</span><span class="module-subtitle">Structured Agent output attached to this work item</span></div>' +
            briefContent(item) +
          '</section>' +
          '<section class="module">' +
            '<div class="module-header"><span class="module-title">Issue overview</span><span class="module-subtitle">Latest grouped monitoring evidence</span></div>' +
            '<div class="fact-grid">' +
              '<div class="fact"><div class="data-label">Events</div><div class="data-value">' + item.events + ' occurrences</div></div>' +
              '<div class="fact"><div class="data-label">First seen</div><div class="data-value">' + escapeHtml(item.firstSeen) + '</div></div>' +
              '<div class="fact"><div class="data-label">Release</div><div class="data-value" title="' + escapeHtml(item.release) + '">' + escapeHtml(item.release) + '</div></div>' +
              '<div class="fact"><div class="data-label">Environment</div><div class="data-value">' + escapeHtml(item.environment) + '</div></div>' +
            '</div>' +
          '</section>' +
          '<section class="module">' +
            '<div class="module-header"><span class="module-title">Activity</span><span class="module-subtitle">Work item history</span></div>' +
            '<div class="activity-list">' + activity + '</div>' +
          '</section>';

        document.getElementById("detailPage").querySelectorAll("[data-action]").forEach(function (button) {
          button.addEventListener("click", function () { handleAction(button.getAttribute("data-action")); });
        });
      }

      function agentSteps(item) {
        var steps = [
          "Loaded the linked issue and latest event",
          "Mapped production frames to restored source",
          "Compared breadcrumbs with the failing code path"
        ];
        return steps.map(function (step, index) {
          var isDone = item.runningStep > index;
          var isRunning = item.runningStep === index;
          var icon = isDone ? "check" : isRunning ? "loader-circle" : "circle";
          var cls = isDone ? "done" : isRunning ? "running" : "";
          return '<div class="agent-step ' + cls + '"><i data-lucide="' + icon + '" class="icon"></i><span>' + step + '</span></div>';
        }).join("");
      }

      function renderAgent() {
        var item = selectedItem();
        var running = item.runningStep >= 0 && item.runningStep < 3;
        document.getElementById("agentTitle").textContent = item.id + " investigation";
        document.getElementById("agentSubtitle").className = "agent-subtitle" + (running ? " running" : "");
        document.getElementById("agentSubtitle").innerHTML = '<span class="dot"></span><span>' + (running ? "Investigating" : item.brief ? "Investigation ready" : "Context ready") + '</span>';

        var body = '<div class="context-card">' +
          '<span class="context-icon"><i data-lucide="link" class="icon"></i></span>' +
          '<div><strong>' + escapeHtml(item.title) + '</strong><span>' + item.project + ' / ' + item.id + '</span></div>' +
        '</div>';

        if (running) {
          body += '<div class="message user"><div class="user-bubble">Investigate ' + item.id + ' and explain the likely root cause.</div></div>' +
            '<div class="message assistant-copy"><p><strong>I’m tracing this Inbox item back to the latest monitoring evidence.</strong></p>' + agentSteps(item) + '</div>';
        } else if (item.brief) {
          body += '<div class="message user"><div class="user-bubble">Investigate ' + item.id + ' and explain the likely root cause.</div></div>' +
            '<div class="message assistant-copy"><p><strong>Investigation summary</strong></p><p>' + escapeHtml(item.brief.summary) + '</p>' +
            '<div class="agent-result"><div class="result-label">Current hypothesis</div><p>' + escapeHtml(item.brief.hypothesis) + '</p></div></div>';
        } else {
          body += '<div class="agent-empty"><div><span class="agent-empty-mark"><i data-lucide="sparkles" class="icon"></i></span>' +
            '<strong>Ready to investigate</strong><p>The selected Inbox item is pinned as context. Start an investigation or ask a focused question.</p>' +
            '<div class="suggestion-list">' +
              '<button class="suggestion" type="button" data-prompt="Why is this issue happening now?">Why now?</button>' +
              '<button class="suggestion" type="button" data-prompt="Compare this release with the previous release.">Compare release</button>' +
              '<button class="suggestion" type="button" data-prompt="Inspect the latest replay and breadcrumbs.">Inspect replay</button>' +
            '</div></div></div>';
        }

        item.conversation.forEach(function (message) {
          if (message.role === "user") {
            body += '<div class="message user"><div class="user-bubble">' + escapeHtml(message.text) + '</div></div>';
          } else {
            body += '<div class="message assistant-copy"><p>' + escapeHtml(message.text) + '</p></div>';
          }
        });

        document.getElementById("agentBody").innerHTML = body;
        document.getElementById("agentBody").querySelectorAll("[data-prompt]").forEach(function (button) {
          button.addEventListener("click", function () {
            document.getElementById("agentInput").value = button.getAttribute("data-prompt");
            document.getElementById("agentInput").focus();
          });
        });
      }

      function renderAll() {
        renderQueue();
        renderDetail();
        renderAgent();
        refreshIcons();
      }

      function addActivity(item, icon, text) {
        item.activity.unshift({ icon: icon, text: text, time: "now" });
      }

      function moveToNextVisible() {
        var visible = filteredItems();
        if (!visible.some(function (item) { return item.id === selectedId; }) && visible.length) {
          selectedId = visible[0].id;
        }
      }

      function handleAction(action) {
        var item = selectedItem();
        if (action === "investigate") {
          startInvestigation(item);
          return;
        }
        if (action === "resolve") {
          item.status = "done";
          addActivity(item, "check", "Marked Done and resolved the linked issue");
          showToast(item.id + " resolved");
        } else if (action === "dismiss") {
          item.status = "dismissed";
          addActivity(item, "circle-off", "Dismissed and ignored the linked issue");
          showToast(item.id + " dismissed");
        } else if (action === "reopen") {
          item.status = "open";
          addActivity(item, "circle-dot", "Reopened for triage");
          activeFilter = "active";
          syncTabs();
          showToast(item.id + " reopened");
        }
        moveToNextVisible();
        renderAll();
      }

      function startInvestigation(item) {
        if (item.runningStep >= 0 && item.runningStep < 3) return;
        item.status = "investigating";
        item.runningStep = 0;
        item.brief = null;
        addActivity(item, "sparkles", "Agent investigation started");
        renderAll();
        showToast("Agent investigation started");

        [1, 2, 3].forEach(function (step, index) {
          window.setTimeout(function () {
            item.runningStep = step;
            if (step === 3) {
              item.brief = {
                summary: "The profile request succeeds, but the cached response is missing the expected profile object.",
                hypothesis: "The submit handler dereferences response.profile before validating the restored cache shape.",
                nextAction: "Guard the cached payload, invalidate legacy entries and add a regression test for the missing profile field."
              };
              addActivity(item, "sparkles", "Agent investigation summary attached");
              showToast("Investigation summary is ready");
            }
            if (selectedId === item.id) renderAll();
            else renderQueue();
          }, 700 + index * 720);
        });
      }

      function showToast(message) {
        var toast = document.getElementById("toast");
        document.getElementById("toastText").textContent = message;
        toast.classList.add("show");
        refreshIcons();
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(function () { toast.classList.remove("show"); }, 2300);
      }

      function syncTabs() {
        document.querySelectorAll(".queue-tab").forEach(function (tab) {
          tab.classList.toggle("active", tab.getAttribute("data-filter") === activeFilter);
          tab.setAttribute("aria-selected", String(tab.getAttribute("data-filter") === activeFilter));
        });
      }

      document.querySelectorAll(".queue-tab").forEach(function (tab) {
        tab.addEventListener("click", function () {
          activeFilter = tab.getAttribute("data-filter");
          syncTabs();
          var visible = filteredItems();
          if (visible.length && !visible.some(function (item) { return item.id === selectedId; })) selectedId = visible[0].id;
          renderAll();
        });
      });

      document.getElementById("queueSearch").addEventListener("input", function (event) {
        query = event.target.value;
        var visible = filteredItems();
        if (visible.length && !visible.some(function (item) { return item.id === selectedId; })) selectedId = visible[0].id;
        renderAll();
      });

      document.getElementById("themeButton").addEventListener("click", function () {
        document.documentElement.classList.toggle("dark");
        var dark = document.documentElement.classList.contains("dark");
        document.getElementById("themeIcon").setAttribute("data-lucide", dark ? "sun" : "moon");
        refreshIcons();
      });

      document.getElementById("refreshButton").addEventListener("click", function () {
        var icon = document.getElementById("refreshIcon");
        icon.style.animation = "spin 700ms linear";
        window.setTimeout(function () { icon.style.animation = ""; }, 720);
        showToast("Inbox is up to date");
      });

      document.getElementById("expandButton").addEventListener("click", function () {
        var region = document.getElementById("mainRegion");
        var expanded = region.classList.toggle("expanded");
        document.getElementById("expandButton").setAttribute("aria-pressed", String(expanded));
        document.getElementById("expandButton").setAttribute("title", expanded ? "Restore split view" : "Maximize content");
        document.getElementById("expandIcon").setAttribute("data-lucide", expanded ? "minimize-2" : "maximize-2");
        refreshIcons();
      });

      function sendAgentMessage() {
        var input = document.getElementById("agentInput");
        var text = input.value.trim();
        if (!text) return;
        var item = selectedItem();
        item.conversation.push({ role: "user", text: text });
        input.value = "";
        renderAgent();
        refreshIcons();
        window.setTimeout(function () {
          item.conversation.push({
            role: "assistant",
            text: item.brief
              ? "The strongest evidence still points to " + item.source + ". I would validate the cached payload before changing broader request logic."
              : "I have the Inbox item pinned. Start Investigate to load the latest event, restored source and breadcrumbs before I form a conclusion."
          });
          if (selectedId === item.id) {
            renderAgent();
            refreshIcons();
            document.getElementById("agentBody").scrollTop = document.getElementById("agentBody").scrollHeight;
          }
        }, 650);
      }

      document.getElementById("sendButton").addEventListener("click", sendAgentMessage);
      document.getElementById("agentInput").addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendAgentMessage();
        }
      });

      document.getElementById("newConversationButton").addEventListener("click", function () {
        selectedItem().conversation = [];
        renderAgent();
        refreshIcons();
        showToast("New conversation started for " + selectedItem().id);
      });

      document.getElementById("floatingAgentButton").addEventListener("click", function () {
        document.querySelector(".agent-panel").classList.add("mobile-open");
      });

      document.getElementById("closeMobileAgentButton").addEventListener("click", function () {
        document.querySelector(".agent-panel").classList.remove("mobile-open");
      });

      window.addEventListener("load", function () {
        syncTabs();
        renderAll();
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traceability · Explorer 交互稿</title>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js" defer></script>
    <style>
      /* ===== Tokens — copied from app/src/renderer/index.css (light + dark) ===== */
      :root {
        color-scheme: light;
        --titlebar-height: 40px;
        --window-controls-left: 76px;

        --canvas: #f3f7fd;
        --ink: #102047;
        --ink-muted: #42547b;
        --subtle: #617196;
        --tertiary: #7b89a8;
        --primary: #4f77ff;
        --primary-hover: #3562f4;
        --primary-soft: #315be1;
        --info: #3f82e9;
        --success: #2fb795;
        --warning: #b3832f;
        --danger: #d85568;
        --hairline: rgba(86, 119, 174, 0.16);
        --hairline-strong: rgba(76, 109, 164, 0.25);
        --surface-1: rgba(255, 255, 255, 0.78);
        --surface-2: rgba(249, 252, 255, 0.82);
        --surface-3: rgba(230, 238, 251, 0.76);
        --surface-glass: rgba(249, 252, 255, 0.62);
        --surface-glass-elevated: rgba(255, 255, 255, 0.88);
        --overlay: rgba(70, 105, 168, 0.055);
        --overlay-strong: rgba(67, 103, 170, 0.1);
        --glow: rgba(94, 132, 255, 0.16);
        --glow-strong: rgba(106, 95, 255, 0.22);
        --code-bg: rgba(246, 249, 255, 0.94);
        --code-text: #24375f;
        --code-line-number: #9cabc8;
        --primary-foreground: #ffffff;
        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);

        --ui-shadow-glass: 0 1px 0 rgba(255, 255, 255, 0.5) inset, 0 12px 34px rgba(16, 32, 71, 0.08),
          0 2px 8px rgba(16, 32, 71, 0.05);
        --ui-shadow-glass-sm: 0 1px 0 rgba(255, 255, 255, 0.6) inset, 0 4px 14px rgba(16, 32, 71, 0.06);
        --ui-shadow-glow: 0 0 0 1px rgba(79, 119, 255, 0.12), 0 10px 26px rgba(79, 119, 255, 0.22);
        --ui-shadow-input: 0 1px 0 rgba(255, 255, 255, 0.5) inset, 0 6px 18px rgba(16, 32, 71, 0.07);

        --font-sans: Inter, "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;

        --content-share: 56%;
      }

      .dark {
        color-scheme: dark;
        --canvas: #080d19;
        --ink: #edf3ff;
        --ink-muted: #abb9d5;
        --subtle: #8f9dbb;
        --tertiary: #72819f;
        --primary: #7292ff;
        --primary-hover: #9aafff;
        --primary-soft: #c4d0ff;
        --info: #6fb9ff;
        --success: #54d4b2;
        --warning: #e0b55e;
        --danger: #f18192;
        --hairline: rgba(155, 180, 229, 0.12);
        --hairline-strong: rgba(165, 188, 235, 0.2);
        --surface-1: rgba(17, 25, 42, 0.82);
        --surface-2: rgba(22, 31, 50, 0.86);
        --surface-3: rgba(30, 41, 64, 0.8);
        --surface-glass: rgba(13, 21, 36, 0.68);
        --surface-glass-elevated: rgba(20, 30, 50, 0.92);
        --overlay: rgba(119, 145, 199, 0.07);
        --overlay-strong: rgba(119, 145, 199, 0.13);
        --glow: rgba(114, 146, 255, 0.2);
        --glow-strong: rgba(154, 175, 255, 0.26);
        --code-bg: rgba(5, 10, 20, 0.9);
        --code-text: #cbd7ef;
        --code-line-number: #5a6b8c;
        --primary-foreground: #071022;
        --ui-shadow-glass: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 18px 44px rgba(0, 0, 0, 0.5),
          0 2px 10px rgba(0, 0, 0, 0.3);
        --ui-shadow-glass-sm: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 6px 18px rgba(3, 6, 12, 0.4);
        --ui-shadow-glow: 0 0 0 1px rgba(114, 146, 255, 0.18), 0 12px 30px rgba(114, 146, 255, 0.26);
        --ui-shadow-input: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 8px 22px rgba(0, 0, 0, 0.45);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background:
          radial-gradient(ellipse 90% 60% at 18% -8%, var(--glow), transparent 55%),
          radial-gradient(ellipse 70% 50% at 92% 4%, var(--glow-strong), transparent 50%),
          var(--canvas);
        color: var(--ink);
        font: 13px/1.45 var(--font-sans);
        letter-spacing: -0.01em;
        transition: background 220ms ease, color 220ms ease;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        background: none;
        border: 0;
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        border: 3px solid transparent;
        border-radius: 999px;
        background: var(--hairline-strong);
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }

      /* ===== Utilities mirroring index.css @utility ===== */
      .glass-panel {
        border: 1px solid var(--hairline);
        background: var(--surface-glass);
        box-shadow: var(--ui-shadow-glass);
        backdrop-filter: blur(26px) saturate(1.22);
      }
      .glass-panel-raised {
        border: 1px solid var(--hairline-strong);
        background: var(--surface-glass-elevated);
        box-shadow: var(--ui-shadow-glass);
        backdrop-filter: blur(30px) saturate(1.3);
      }
      .glass-control {
        border: 1px solid var(--hairline);
        background: var(--surface-1);
        box-shadow: var(--ui-shadow-glass-sm);
        backdrop-filter: blur(18px) saturate(1.18);
      }
      .shadow-glow {
        box-shadow: var(--ui-shadow-glow);
      }
      .shadow-glass-sm {
        box-shadow: var(--ui-shadow-glass-sm);
      }
      .workspace-scroll {
        scrollbar-gutter: stable;
        overscroll-behavior: contain;
      }

      .icon {
        stroke-width: 1.8;
        pointer-events: none;
      }

      /* ===== App shell ===== */
      .app-shell {
        height: 100%;
        display: flex;
        gap: 8px;
        padding: calc(var(--titlebar-height) + 8px) 8px 8px;
      }
      .titlebar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 60;
        height: var(--titlebar-height);
        display: flex;
        align-items: center;
        gap: 8px;
        padding-left: var(--window-controls-left);
        padding-right: 14px;
        border-bottom: 1px solid var(--hairline);
        background: var(--surface-glass);
        backdrop-filter: blur(24px) saturate(1.3);
        -webkit-app-region: drag;
      }
      .titlebar .tb-brand {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--primary-hover);
        font-size: 12px;
        font-weight: 620;
        letter-spacing: 0.01em;
        -webkit-app-region: no-drag;
      }
      .titlebar .tb-sep {
        width: 1px;
        height: 14px;
        background: var(--hairline);
      }
      .titlebar .tb-note {
        color: var(--tertiary);
        font-size: 10px;
        font-weight: 590;
      }
      .titlebar .tb-spacer {
        flex: 1;
      }
      .titlebar .tb-live {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--success);
        font-size: 10px;
        font-weight: 620;
      }
      .titlebar .tb-live .dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--success);
        box-shadow: 0 0 0 3px rgba(47, 183, 149, 0.16);
      }
      .win-controls {
        position: fixed;
        top: 13px;
        left: 14px;
        display: flex;
        gap: 8px;
        z-index: 61;
      }
      .win-controls span {
        width: 12px;
        height: 12px;
        border-radius: 999px;
      }
      .win-controls .wc-close {
        background: #fc615d;
      }
      .win-controls .wc-min {
        background: #fdbc40;
      }
      .win-controls .wc-max {
        background: #34c84a;
      }

      /* Sidebar (56px icon rail) */
      .sidebar {
        flex: 0 0 56px;
        width: 56px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 12px 8px;
        border-radius: 18px;
      }
      .sidebar .sb-brand {
        display: grid;
        place-items: center;
        width: 32px;
        height: 28px;
        color: var(--primary-hover);
      }
      .nav-icon {
        position: relative;
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border: 1px solid var(--hairline);
        border-radius: 10px;
        background: var(--overlay);
        color: var(--ink-muted);
        transition: 150ms var(--ease-out);
      }
      .nav-icon:hover {
        border-color: var(--hairline-strong);
        background: var(--overlay-strong);
        color: var(--ink);
      }
      .nav-icon.active {
        border-color: rgba(79, 119, 255, 0.2);
        background: rgba(79, 119, 255, 0.1);
        color: var(--primary-hover);
        box-shadow: var(--ui-shadow-glass-sm);
      }
      .nav-icon .badge {
        position: absolute;
        top: -4px;
        right: -4px;
        min-width: 15px;
        height: 15px;
        padding: 0 3px;
        border: 2px solid var(--canvas);
        border-radius: 999px;
        background: var(--danger);
        color: #fff;
        font-size: 8px;
        font-weight: 700;
        line-height: 11px;
        text-align: center;
      }
      .sidebar .sb-spacer {
        flex: 1;
      }
      .sidebar .sb-foot {
        width: 100%;
        border-top: 1px solid var(--hairline);
        padding-top: 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .avatar {
        width: 30px;
        height: 30px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--primary), #8b6fff);
        color: #fff;
        font-size: 11px;
        font-weight: 680;
        display: grid;
        place-items: center;
      }

      /* Main region + resizable split */
      .main-region {
        position: relative;
        flex: 1;
        min-width: 0;
        display: flex;
        border-radius: 18px;
        overflow: hidden;
      }
      .content-panel {
        display: flex;
        flex-direction: column;
        min-width: 0;
        flex: 0 0 var(--content-share);
        width: var(--content-share);
        border-radius: 18px;
        overflow: hidden;
        transition:
          width 240ms var(--ease-out),
          flex-basis 240ms var(--ease-out);
      }
      .main-region.focus-content .content-panel {
        flex: 1 1 100%;
        width: 100%;
      }
      .splitter {
        flex: 0 0 8px;
        width: 8px;
        position: relative;
        z-index: 12;
        cursor: col-resize;
      }
      .splitter::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 3px;
        transform: translateX(-50%);
        background: transparent;
        border-radius: 999px;
        transition: background 150ms;
      }
      .splitter:hover::after,
      .splitter.dragging::after {
        background: var(--primary);
        opacity: 0.4;
      }
      .main-region.focus-content .splitter {
        pointer-events: none;
        width: 0;
        flex: 0 0 0;
      }
      .agent-panel {
        display: flex;
        flex-direction: column;
        min-width: 0;
        flex: 1;
        border-radius: 18px;
        overflow: hidden;
      }
      .main-region.focus-content .agent-panel {
        display: none;
      }

      /* Workspace header */
      .ws-header {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 48px;
        flex: 0 0 48px;
        padding: 0 18px;
        border-bottom: 1px solid var(--hairline);
        background: rgba(249, 252, 255, 0.75);
        backdrop-filter: blur(20px) saturate(1.25);
      }
      .dark .ws-header {
        background: rgba(13, 21, 36, 0.78);
      }
      .crumb {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--tertiary);
        font-size: 11px;
      }
      .crumb .proj {
        color: var(--ink-muted);
        font-weight: 620;
      }
      .crumb .cur {
        color: var(--ink-muted);
      }
      .crumb i {
        width: 12px;
        height: 12px;
      }
      .ws-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .live-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(47, 183, 149, 0.18);
        background: rgba(47, 183, 149, 0.07);
        border-radius: 999px;
        padding: 3px 9px;
        color: var(--success);
        font-size: 10px;
        font-weight: 620;
      }
      .live-pill .d {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--success);
      }
      .live-pill.warn {
        border-color: rgba(179, 131, 47, 0.28);
        background: rgba(179, 131, 47, 0.08);
        color: var(--warning);
      }
      .live-pill.warn .d {
        background: var(--warning);
        animation: pulse 1.3s ease infinite;
      }
      .live-pill.danger {
        border-color: rgba(216, 85, 104, 0.28);
        background: rgba(216, 85, 104, 0.08);
        color: var(--danger);
      }
      .live-pill.danger .d {
        background: var(--danger);
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.45;
          transform: scale(0.82);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        height: 34px;
        padding: 0 12px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 590;
        color: var(--ink-muted);
        transition:
          color 150ms var(--ease-out),
          background-color 150ms var(--ease-out),
          border-color 150ms var(--ease-out);
      }
      .btn-secondary {
        border: 1px solid var(--hairline);
        background: var(--surface-1);
        box-shadow: var(--ui-shadow-glass-sm);
        backdrop-filter: blur(18px) saturate(1.18);
      }
      .btn-secondary:hover {
        border-color: var(--hairline-strong);
        background: var(--surface-2);
        color: var(--ink);
      }
      .btn-primary {
        border: 1px solid rgba(79, 119, 255, 0.7);
        background: var(--primary);
        color: var(--primary-foreground);
        box-shadow: var(--ui-shadow-glow);
      }
      .btn-primary:hover {
        background: var(--primary-hover);
        border-color: var(--primary-hover);
      }
      .btn-ghost {
        background: transparent;
        border: 1px solid transparent;
        color: var(--tertiary);
      }
      .btn-ghost:hover {
        background: var(--overlay-strong);
        color: var(--ink);
      }
      .btn-sm {
        height: 30px;
        padding: 0 10px;
        font-size: 11px;
        border-radius: 9px;
      }
      .icon-btn {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        border: 1px solid var(--hairline);
        background: var(--overlay);
        color: var(--tertiary);
        transition: 150ms var(--ease-out);
      }
      .icon-btn:hover {
        border-color: var(--hairline-strong);
        background: var(--overlay-strong);
        color: var(--ink);
      }
      .icon-btn.active {
        border-color: rgba(79, 119, 255, 0.35);
        background: rgba(79, 119, 255, 0.1);
        color: var(--primary-hover);
      }
      .icon-btn-sm {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 7px;
        color: var(--tertiary);
        transition: 120ms;
      }
      .icon-btn-sm:hover {
        background: var(--overlay-strong);
        color: var(--ink);
      }
      .send-btn {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: var(--primary);
        color: #fff;
        box-shadow: var(--ui-shadow-glow);
      }
      .send-btn.danger {
        background: rgba(216, 85, 104, 0.15);
        color: var(--danger);
        box-shadow: none;
        border: 1px solid rgba(216, 85, 104, 0.3);
      }

      /* Workspace scroll body */
      .ws-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        background: rgba(230, 238, 251, 0.12);
      }
      .dark .ws-body {
        background: rgba(20, 30, 50, 0.18);
      }
      .page {
        max-width: 1260px;
        margin: 0 auto;
        padding: 22px 22px 48px;
      }

      /* Eyebrow + headings */
      .eyebrow {
        color: var(--primary-hover);
        font-size: 11px;
        font-weight: 680;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      h1.page-h1 {
        margin: 6px 0 0;
        font-size: 24px;
        font-weight: 680;
        letter-spacing: -0.04em;
        line-height: 1.12;
      }
      .page-desc {
        margin: 8px 0 0;
        font-size: 12px;
        color: var(--tertiary);
      }

      /* Cards / modules */
      .module {
        border-radius: 16px;
        overflow: hidden;
      }
      .module-head {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 46px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--hairline);
      }
      .module-head .t {
        font-size: 12px;
        font-weight: 660;
        color: var(--ink-muted);
      }
      .module-head .s {
        font-size: 10px;
        color: var(--tertiary);
      }
      .module-head .right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 22px;
        padding: 0 8px;
        border-radius: 999px;
        border: 1px solid var(--hairline);
        background: var(--overlay);
        font-size: 9px;
        font-weight: 650;
        color: var(--ink-muted);
        white-space: nowrap;
      }
      .pill .d {
        width: 6px;
        height: 6px;
        border-radius: 999px;
      }
      .pill.danger {
        border-color: rgba(216, 85, 104, 0.25);
        background: rgba(216, 85, 104, 0.08);
        color: var(--danger);
      }
      .pill.success {
        border-color: rgba(47, 183, 149, 0.2);
        background: rgba(47, 183, 149, 0.08);
        color: var(--success);
      }
      .pill.warning {
        border-color: rgba(179, 131, 47, 0.25);
        background: rgba(179, 131, 47, 0.08);
        color: var(--warning);
      }
      .pill.primary {
        border-color: rgba(79, 119, 255, 0.25);
        background: rgba(79, 119, 255, 0.1);
        color: var(--primary-hover);
      }
      .mono {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--tertiary);
      }

      /* ===== Graph list ===== */
      .list-toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 18px 0;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        flex: 1;
        min-width: 220px;
        padding: 0 10px;
        border-radius: 10px;
      }
      .search input {
        min-width: 0;
        flex: 1;
        border: 0;
        background: transparent;
        outline: none;
        font-size: 12px;
        color: var(--ink);
      }
      .search input::placeholder {
        color: var(--tertiary);
      }
      .seg {
        display: inline-flex;
        padding: 3px;
        gap: 2px;
        border-radius: 11px;
        background: var(--overlay);
      }
      .seg button {
        height: 28px;
        padding: 0 12px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 590;
        color: var(--tertiary);
      }
      .seg button.active {
        border: 1px solid rgba(79, 119, 255, 0.35);
        background: rgba(79, 119, 255, 0.1);
        color: var(--ink);
        box-shadow: var(--ui-shadow-glass-sm);
      }

      .graph-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 12px;
      }
      .graph-card {
        border-radius: 16px;
        padding: 16px;
        cursor: pointer;
        transition:
          transform 180ms var(--ease-out),
          border-color 180ms;
      }
      .graph-card:hover {
        transform: translateY(-2px);
        border-color: var(--hairline-strong);
      }
      .graph-card .gc-top {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      .graph-card .gc-icon {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 11px;
        border: 1px solid rgba(79, 119, 255, 0.2);
        background: rgba(79, 119, 255, 0.1);
        color: var(--primary-hover);
        flex: 0 0 36px;
      }
      .graph-card .gc-title {
        font-size: 13px;
        font-weight: 660;
        color: var(--ink);
        line-height: 1.35;
      }
      .graph-card .gc-id {
        margin-top: 3px;
      }
      .graph-card .gc-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        margin-top: 12px;
        font-size: 10px;
        color: var(--tertiary);
      }
      .graph-card .gc-meta span {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .graph-card .gc-foot {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--hairline);
      }
      .graph-card.archived {
        opacity: 0.62;
      }

      .empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 56px 20px;
      }
      .empty .tile {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 13px;
        border: 1px solid rgba(79, 119, 255, 0.2);
        background: rgba(79, 119, 255, 0.1);
        color: var(--primary-hover);
        box-shadow: var(--ui-shadow-glow);
        margin-bottom: 16px;
      }
      .empty h3 {
        margin: 0;
        font-size: 15px;
        font-weight: 660;
      }
      .empty p {
        margin: 8px 0 18px;
        max-width: 380px;
        font-size: 12px;
        color: var(--tertiary);
        line-height: 1.6;
      }
      .empty .hint {
        margin-top: 14px;
        font-size: 11px;
        color: var(--tertiary);
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .kbd {
        display: inline-grid;
        place-items: center;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border: 1px solid var(--hairline-strong);
        border-bottom-width: 2px;
        border-radius: 5px;
        background: var(--surface-1);
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--ink-muted);
      }

      /* ===== Canvas (Graph Detail) ===== */
      .canvas-host {
        position: relative;
        height: 100%;
        overflow: hidden;
        background:
          radial-gradient(circle at 30% 20%, rgba(79, 119, 255, 0.05), transparent 40%),
          radial-gradient(circle at 75% 80%, rgba(139, 111, 255, 0.05), transparent 42%);
      }
      .canvas-grid {
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(circle, var(--hairline) 1px, transparent 1px);
        background-size: 22px 22px;
        opacity: 0.55;
        pointer-events: none;
      }
      .canvas-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .canvas-toolbar {
        position: absolute;
        top: 14px;
        left: 14px;
        z-index: 8;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .canvas-status {
        position: absolute;
        top: 14px;
        right: 14px;
        z-index: 8;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .canvas-mini {
        position: absolute;
        left: 14px;
        bottom: 14px;
        z-index: 8;
        width: 150px;
        height: 92px;
        border-radius: 12px;
        padding: 8px;
      }
      .canvas-legend {
        position: absolute;
        right: 14px;
        bottom: 14px;
        z-index: 8;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        max-width: 340px;
        padding: 8px 10px;
        border-radius: 12px;
      }
      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 9px;
        font-weight: 590;
        color: var(--ink-muted);
      }
      .legend-dot {
        width: 8px;
        height: 8px;
        border-radius: 3px;
      }

      /* Node card */
      .node {
        position: absolute;
        width: 210px;
        border-radius: 14px;
        padding: 12px 12px 11px;
        cursor: grab;
        user-select: none;
        transition:
          box-shadow 180ms var(--ease-out),
          border-color 180ms;
        z-index: 2;
      }
      .node.dragging {
        cursor: grabbing;
        z-index: 20;
        box-shadow: 0 22px 50px rgba(16, 32, 71, 0.22);
      }
      .node.selected {
        border-color: var(--primary);
        box-shadow:
          0 0 0 3px var(--glow),
          var(--ui-shadow-glass);
      }
      .node.entering {
        animation: nodeIn 420ms var(--ease-out);
      }
      @keyframes nodeIn {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .node .n-top {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 8px;
      }
      .node .n-icon {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 7px;
        flex: 0 0 24px;
      }
      .node .n-kind {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .node .n-status {
        margin-left: auto;
      }
      .node .n-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--ink);
        line-height: 1.4;
      }
      .node .n-sub {
        margin-top: 5px;
        font-size: 10px;
        color: var(--tertiary);
        line-height: 1.5;
      }
      .node .n-conf {
        margin-top: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .conf-bar {
        flex: 1;
        height: 4px;
        border-radius: 999px;
        background: var(--overlay-strong);
        overflow: hidden;
      }
      .conf-bar > i {
        display: block;
        height: 100%;
        border-radius: 999px;
        background: var(--primary);
      }

      /* Node type accents */
      .node[data-type="question"] {
        --nt: var(--primary);
        --nt-bg: rgba(79, 119, 255, 0.1);
      }
      .node[data-type="finding"] {
        --nt: var(--warning);
        --nt-bg: rgba(179, 131, 47, 0.1);
      }
      .node[data-type="issue"] {
        --nt: var(--danger);
        --nt-bg: rgba(216, 85, 104, 0.1);
      }
      .node[data-type="event"] {
        --nt: var(--info);
        --nt-bg: rgba(63, 130, 233, 0.1);
      }
      .node[data-type="replay"] {
        --nt: #8b6fff;
        --nt-bg: rgba(139, 111, 255, 0.1);
      }
      .node[data-type="code"] {
        --nt: var(--ink-muted);
        --nt-bg: var(--overlay-strong);
      }
      .node[data-type="document"] {
        --nt: var(--tertiary);
        --nt-bg: var(--overlay-strong);
      }
      .node .n-icon {
        background: var(--nt-bg);
        color: var(--nt);
      }
      .node .n-kind {
        color: var(--nt);
      }
      .node.loading .n-title {
        color: var(--tertiary);
      }
      .node.loading .n-title::after {
        content: " · 加载中…";
      }
      .node.error {
        border-color: rgba(216, 85, 104, 0.4);
      }
      .node.error .n-title {
        color: var(--danger);
      }

      .edge-label {
        fill: var(--tertiary);
        font-family: var(--font-sans);
        font-size: 9px;
        font-weight: 600;
      }
      .edge-label-bg {
        fill: var(--canvas);
      }
      .dark .edge-label-bg {
        fill: rgba(13, 21, 36, 0.92);
      }
      .edge-path {
        fill: none;
        stroke: var(--hairline-strong);
        stroke-width: 1.5;
      }
      .edge-path.highlight {
        stroke: var(--primary);
        stroke-width: 2;
      }

      /* Status banners */
      .canvas-banner {
        position: absolute;
        top: 60px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 590;
        animation: nodeIn 260ms var(--ease-out);
      }
      .canvas-banner.warn {
        border: 1px solid rgba(179, 131, 47, 0.3);
        background: rgba(179, 131, 47, 0.1);
        color: var(--warning);
        backdrop-filter: blur(18px);
      }
      .canvas-banner.danger {
        border: 1px solid rgba(216, 85, 104, 0.3);
        background: rgba(216, 85, 104, 0.1);
        color: var(--danger);
        backdrop-filter: blur(18px);
      }
      .canvas-banner.info {
        border: 1px solid rgba(79, 119, 255, 0.28);
        background: rgba(79, 119, 255, 0.1);
        color: var(--primary-hover);
        backdrop-filter: blur(18px);
      }

      /* Node detail drawer */
      .drawer-scrim {
        position: absolute;
        inset: 0;
        z-index: 30;
        background: rgba(16, 32, 71, 0.18);
        backdrop-filter: blur(2px);
        animation: fade 180ms ease;
      }
      .dark .drawer-scrim {
        background: rgba(0, 0, 0, 0.4);
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
      }
      .drawer {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 31;
        width: min(420px, 86%);
        display: flex;
        flex-direction: column;
        border-left: 1px solid var(--hairline);
        background: var(--surface-glass-elevated);
        backdrop-filter: blur(30px) saturate(1.3);
        box-shadow: -20px 0 60px rgba(16, 32, 71, 0.14);
        animation: drawerIn 240ms var(--ease-out);
      }
      @keyframes drawerIn {
        from {
          transform: translateX(24px);
          opacity: 0;
        }
      }
      .drawer-head {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 16px 16px 12px;
        border-bottom: 1px solid var(--hairline);
      }
      .drawer-head .di {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        flex: 0 0 34px;
      }
      .drawer-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 14px 16px 20px;
      }
      .drawer-foot {
        border-top: 1px solid var(--hairline);
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .kv {
        display: grid;
        grid-template-columns: 88px 1fr;
        gap: 6px 10px;
        font-size: 11px;
      }
      .kv dt {
        color: var(--tertiary);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-weight: 640;
      }
      .kv dd {
        margin: 0;
        color: var(--ink-muted);
      }
      .id-copy {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--ink-muted);
        background: var(--overlay);
        border: 1px solid var(--hairline);
        border-radius: 6px;
        padding: 2px 6px;
        cursor: pointer;
      }
      .id-copy:hover {
        background: var(--overlay-strong);
        color: var(--ink);
      }
      .sub-section {
        margin-top: 16px;
      }
      .sub-section > h4 {
        margin: 0 0 8px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--tertiary);
      }
      .evidence-row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 9px 10px;
        border: 1px solid var(--hairline);
        border-radius: 10px;
        margin-bottom: 7px;
        background: var(--overlay);
      }
      .evidence-row .ei {
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        border-radius: 7px;
        flex: 0 0 22px;
      }
      .evidence-row .et {
        font-size: 11px;
        font-weight: 590;
        color: var(--ink);
        line-height: 1.4;
      }
      .evidence-row .es {
        font-size: 10px;
        color: var(--tertiary);
      }
      .code-snip {
        margin: 8px 0 0;
        border-radius: 10px;
        border: 1px solid var(--hairline);
        background: var(--code-bg);
        padding: 10px 12px;
        font-family: var(--font-mono);
        font-size: 10px;
        line-height: 1.7;
        color: var(--code-text);
        overflow: auto;
        white-space: pre;
      }
      .code-snip .ln {
        color: var(--code-line-number);
        user-select: none;
        display: inline-block;
        width: 26px;
      }
      .code-snip .hl {
        background: rgba(79, 119, 255, 0.14);
        border-radius: 3px;
      }
      .source-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 590;
        color: var(--primary-hover);
        text-decoration: none;
      }
      .source-link:hover {
        text-decoration: underline;
      }

      /* ===== Agent panel ===== */
      .agent-head {
        display: flex;
        align-items: center;
        gap: 9px;
        height: 48px;
        flex: 0 0 48px;
        padding: 0 13px;
        border-bottom: 1px solid var(--hairline);
        background: rgba(249, 252, 255, 0.7);
        backdrop-filter: blur(20px) saturate(1.25);
      }
      .dark .agent-head {
        background: rgba(13, 21, 36, 0.74);
      }
      .agent-glyph {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 9px;
        border: 1px solid rgba(79, 119, 255, 0.2);
        background: rgba(79, 119, 255, 0.1);
        color: var(--primary-hover);
        box-shadow: var(--ui-shadow-glass-sm);
      }
      .agent-titles {
        min-width: 0;
        flex: 1;
      }
      .agent-titles strong {
        display: block;
        font-size: 12px;
        font-weight: 650;
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .agent-sub {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 2px;
        font-size: 9px;
        color: var(--tertiary);
      }
      .agent-sub .rdot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--primary);
        animation: pulse 1.4s ease infinite;
      }
      .agent-sub.idle .rdot {
        background: var(--tertiary);
        animation: none;
      }

      .agent-body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 16px 12px 24px;
      }
      .agent-body-inner {
        max-width: 720px;
        margin: 0 auto;
      }

      .msg {
        margin: 0 0 18px;
        max-width: 690px;
        margin-left: auto;
        margin-right: auto;
      }
      .msg.user {
        display: flex;
        justify-content: flex-end;
      }
      .user-bubble {
        max-width: 82%;
        border: 1px solid rgba(79, 119, 255, 0.2);
        border-radius: 15px 15px 5px 15px;
        background: linear-gradient(135deg, rgba(115, 146, 255, 0.17), rgba(139, 111, 255, 0.1));
        padding: 9px 12px;
        font-size: 12px;
        line-height: 1.55;
        color: var(--ink);
        box-shadow: var(--ui-shadow-glass-sm);
        backdrop-filter: blur(20px);
      }
      .user-bubble .mention {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border: 1px solid rgba(79, 119, 255, 0.25);
        background: rgba(79, 119, 255, 0.15);
        border-radius: 5px;
        padding: 1px 6px;
        font-size: 11px;
        font-weight: 620;
        color: var(--primary-hover);
      }

      .assistant {
        border-radius: 15px;
        padding: 12px;
        border: 1px solid var(--hairline);
        background: var(--surface-1);
        box-shadow: var(--ui-shadow-glass-sm);
        backdrop-filter: blur(18px) saturate(1.18);
      }
      .assistant .a-head {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
        font-size: 10px;
        font-weight: 620;
        color: var(--tertiary);
      }
      .assistant .a-head .glyph {
        color: var(--primary-hover);
      }
      .assistant .a-head .proc {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--primary-hover);
      }
      .assistant .a-body {
        font-size: 12px;
        line-height: 1.62;
        color: var(--ink-muted);
      }
      .assistant .a-body p {
        margin: 0 0 8px;
      }
      .assistant .a-body p:last-child {
        margin-bottom: 0;
      }
      .assistant .a-body strong {
        color: var(--ink);
        font-weight: 640;
      }
      .assistant .a-body ul {
        margin: 6px 0 8px;
        padding-left: 18px;
      }
      .assistant .a-body li {
        margin-bottom: 4px;
      }
      .assistant .a-body code {
        font-family: var(--font-mono);
        font-size: 11px;
        background: var(--overlay-strong);
        border-radius: 4px;
        padding: 1px 5px;
        color: var(--ink);
      }

      .collapsible {
        margin-top: 10px;
      }
      .collapse-trigger {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 6px 8px;
        border-radius: 8px;
        background: var(--overlay);
        font-size: 10px;
        color: var(--tertiary);
        transition: 120ms;
      }
      .collapse-trigger:hover {
        background: var(--overlay-strong);
        color: var(--ink-muted);
      }
      .collapse-trigger i {
        transition: transform 180ms var(--ease-out);
      }
      .collapsible.open .collapse-trigger i {
        transform: rotate(90deg);
      }
      .collapse-body {
        display: none;
        margin-top: 8px;
      }
      .collapsible.open .collapse-body {
        display: block;
      }

      /* Tool status rows */
      .tool-row {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 10px;
        border: 1px solid var(--hairline);
        border-radius: 10px;
        background: var(--overlay);
        margin-bottom: 7px;
      }
      .tool-row .ti {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background: var(--overlay-strong);
        color: var(--tertiary);
        flex: 0 0 24px;
      }
      .tool-row.running .ti {
        color: var(--primary-hover);
        background: rgba(79, 119, 255, 0.1);
      }
      .tool-row.ok .ti {
        color: var(--success);
        background: rgba(47, 183, 149, 0.1);
      }
      .tool-row.err .ti {
        color: var(--danger);
        background: rgba(216, 85, 104, 0.1);
      }
      .tool-row .tn {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--ink);
        font-weight: 600;
      }
      .tool-row .td {
        font-size: 10px;
        color: var(--tertiary);
        margin-top: 1px;
      }
      .tool-row .tstate {
        margin-left: auto;
        font-size: 9px;
        font-weight: 620;
        color: var(--tertiary);
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .tool-row.running .tstate {
        color: var(--primary-hover);
      }
      .tool-row.ok .tstate {
        color: var(--success);
      }
      .tool-row.err .tstate {
        color: var(--danger);
      }
      .spin {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Assistant block card (Open Explorer Graph) */
      .block-card {
        margin-top: 12px;
        border-radius: 13px;
        border: 1px solid rgba(79, 119, 255, 0.22);
        background: rgba(79, 119, 255, 0.06);
        padding: 14px;
      }
      .block-card .bc-top {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .block-card .bc-icon {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        border: 1px solid rgba(79, 119, 255, 0.2);
        background: rgba(79, 119, 255, 0.1);
        color: var(--primary-hover);
        box-shadow: var(--ui-shadow-glow);
      }
      .block-card .bc-title {
        font-size: 12px;
        font-weight: 660;
        color: var(--ink);
      }
      .block-card .bc-sub {
        font-size: 10px;
        color: var(--tertiary);
        margin-top: 2px;
      }
      .block-card .bc-stats {
        display: flex;
        gap: 14px;
        margin: 12px 0;
        padding: 10px 12px;
        border-radius: 9px;
        background: var(--overlay);
      }
      .block-card .bc-stats .st {
        display: flex;
        flex-direction: column;
      }
      .block-card .bc-stats .st b {
        font-size: 15px;
        font-weight: 680;
        color: var(--ink);
        letter-spacing: -0.03em;
      }
      .block-card .bc-stats .st span {
        font-size: 9px;
        color: var(--tertiary);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .block-card .bc-actions {
        display: flex;
        gap: 8px;
      }

      /* Read-only graph preview (mermaid-ish ASCII) */
      .preview {
        margin-top: 10px;
        border-radius: 12px;
        border: 1px solid var(--hairline);
        background: var(--code-bg);
        padding: 14px 16px;
        font-family: var(--font-mono);
        font-size: 10.5px;
        line-height: 1.85;
        color: var(--code-text);
        white-space: pre;
        overflow: auto;
      }
      .preview .p-q {
        color: var(--primary-hover);
        font-weight: 600;
      }
      .preview .p-i {
        color: var(--danger);
      }
      .preview .p-f {
        color: var(--warning);
      }
      .preview .p-c {
        color: var(--ink-muted);
      }
      .preview .p-e {
        color: var(--info);
      }

      /* AskUserQuestion panel */
      .ask {

          : n.status === "loading"
          ? '<span class="pill n-status"><span class="d" style="background:var(--primary)"></span>加载中</span>'
          : n.status === "error"
          ? '<span class="pill danger n-status"><span class="d"></span>失败</span>'
          : "";
        const conf = n.conf != null
          ? `<div class="n-conf"><div class="conf-bar"><i style="width:${n.conf}%"></i></div><span class="mono">${n.conf}%</span></div>`
          : "";
        const entering = opts.entering ? "entering" : "";
        const loading = n.status === "loading" ? "loading" : "";
        const error = n.status === "error" ? "error" : "";
        return `<div class="node glass-panel ${entering} ${loading} ${error}" data-type="${n.type}" data-node="${n.id}" style="left:${n.x}px;top:${n.y}px">
          <div class="n-top">
            <span class="n-icon"><i data-lucide="${m.icon}" style="width:14px;height:14px"></i></span>
            <span class="n-kind">${m.label}</span>

          ${n.sub ? `<div class="n-sub">${n.sub}</div>` : ""}
          ${conf}
        </div>`;
      }

      function drawEdges(nodeIds) {
        const svg = el("canvasSvg");
        if (!svg) return;
        const host = el("canvasHost");
        const pos = {};
        nodeIds.forEach((k) => {
          const node = G[k];
          const card = host.querySelector(`[data-node="${node.id}"]`);
          if (card) {
            const r = card.getBoundingClientRect();
            const hr = host.getBoundingClientRect();
            pos[k] = { x: r.left - hr.left + r.width / 2, y: r.top - hr.top + r.height / 2, w: r.width, h: r.height };
          }
        });
        let paths = "";
        EDGES.forEach(([s, t, rel]) => {
          if (!pos[s] || !pos[t]) return;
          const a = pos[s], b = pos[t];
          const sx = a.x, sy = a.y + a.h / 2 - 6;
          const tx = b.x, ty = b.y - b.h / 2 + 6;
          const mx = (sx + tx) / 2;
          const d = `M ${sx} ${sy} C ${mx} ${sy}, ${mx} ${ty}, ${tx} ${ty}`;
          const lx = mx, ly = (sy + ty) / 2;
          paths += `<path class="edge-path" d="${d}" marker-end="url(#arrow)"/>`;
          paths += `<rect class="edge-label-bg" x="${lx - 32}" y="${ly - 7}" width="64" height="14" rx="4"/>`;
          paths += `<text class="edge-label" x="${lx}" y="${ly + 3}" text-anchor="middle">${rel}</text>`;
        });
        svg.innerHTML = `<defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--hairline-strong)"/>
            </marker>
          </defs>${paths}`;
      }

      /* ---------------- Node drag ---------------- */

      function bindNodeEvents() {
        document.querySelectorAll(".node").forEach((node) => {
          node.addEventListener("click", (e) => {
            if (node.dataset.dragged === "1") { node.dataset.dragged = "0"; return; }
            const id = node.dataset.node;
            const key = Object.keys(G).find((k) => G[k].id === id);
            openDrawer(key);
          });
          makeDraggable(node);
        });
      }

      function makeDraggable(node) {
        let sx, sy, ox, oy, moved = false;
        node.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          e.preventDefault();
          sx = e.clientX; sy = e.clientY;
          ox = parseInt(node.style.left); oy = parseInt(node.style.top);
          node.classList.add("dragging");
          node.setPointerCapture(e.pointerId);
          moved = false;
        });
        node.addEventListener("pointermove", (e) => {
          if (!node.classList.contains("dragging")) return;
          const dx = e.clientX - sx, dy = e.clientY - sy;
          if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
          node.style.left = ox + dx + "px";
          node.style.top = oy + dy + "px";
          drawEdges(["q", "i", "f", "e", "c", "r"]);
        });
        node.addEventListener("pointerup", () => {
          node.classList.remove("dragging");
          if (moved) {
            node.dataset.dragged = "1";
            // optimistic save flow
            showToast("info", "loader-circle", "正在保存位置…");
            setTimeout(() => {
              showToast("success", "check", "位置已同步 · v6");
            }, 700);
          }
        });
      }

        return `<div class="msg user"><div class="user-bubble">继续调查，定位到具体代码：<code style="font-family:var(--font-mono);font-size:11px">src/register.ts L378-385</code>，Graph <code style="font-family:var(--font-mono);font-size:11px">g_8a3f21</code></div></div>
        <div class="msg"><article class="assistant">
          <div class="a-head"><i data-lucide="sparkles" style="width:13px;height:13px" class="glyph"></i>Traceability Agent<span class="proc"><i data-lucide="loader-circle" style="width:11px;height:11px" class="spin"></i>正在处理</span></div>
          <div class="a-body">
            <p>已确认 Graph <code>g_8a3f21</code>，继续调查并实时写入。每完成一个工具，新节点会即时出现在 Canvas 上：</p>
            <div style="margin-top:8px">${rows.map((r) => toolRowHtml(r)).join("")}</div>
          </div>
        </article></div>`;
      }

      function idleAfterMsg(a) {
        return `<div class="msg"><article class="assistant">
          <div class="a-head"><i data-lucide="sparkles" style="width:13px;height:13px" class="glyph"></i>Traceability Agent<span class="proc" style="color:var(--success)"><i data-lucide="check" style="width:11px;height:11px"></i>已处理</span></div>
          <div class="a-body">
            <p>调查完成。当前结论：<strong>register.ts 在校验缓存 payload 形状前解引用 response.profile</strong>，置信度 72%。Event 与 Replay 均观察到了该异常。</p>
            <p>可点击任意 Node 查看详情，或在 Prompt 中写入 Graph ID / Node ID 继续调查。</p>
          </div>
        </article></div>`;
      }

      function agentFoot(a) {
        if (a === "slash") {
          return `<div class="prompt-wrap"><div class="prompt-box">
            <div class="prompt-area"><div class="prompt-text"><span class="ph">/</span></div></div>
            <div class="slash-pop">
              <div class="slash-group">Skills</div>
              <div class="slash-item sel">
                <span class="si-icon"><i data-lucide="compass" style="width:15px;height:15px"></i></span>
                <div><div class="si-name">explorer-graph-create</div><div class="si-desc">确认上下文与意图后创建 Explorer 证据图</div></div>
                <span class="si-key kbd">↵</span>
              </div>
              <div class="slash-item">
                <span class="si-icon"><i data-lucide="bug" style="width:15px;height:15px"></i></span>
                <div><div class="si-name">diagnose-issue</div><div class="si-desc">围绕一个 Issue 进行结构化诊断</div></div>
              </div>
              <div class="slash-item">
                <span class="si-icon"><i data-lucide="settings" style="width:15px;height:15px"></i></span>
                <div><div class="si-name">setup</div><div class="si-desc">配置项目与监控</div></div>
              </div>
            </div>
            <div class="prompt-foot">
              <span class="model-pill"><i data-lucide="cpu" style="width:11px;height:11px"></i>deepseek-chat</span>
              <button class="send-btn" style="margin-left:auto"><i data-lucide="arrow-up" style="width:14px;height:14px"></i></button>
            </div>
          </div><div class="prompt-help">Enter 发送 · Shift+Enter 换行</div></div>`;
        }
        if (a === "prompt-filled") {
          return `<div class="prompt-wrap"><div class="prompt-box">
            <div class="prompt-area"><div class="prompt-text"><span class="mention"><i data-lucide="compass" style="width:11px;height:11px"></i>explorer-graph-create</span> 请帮我创建关于 checkout-web TypeError: Cannot read properties of undefined 的 graph，定位根因并建立 Issue → Code 的证据关系。</div></div>
            <div class="prompt-foot">
              <span class="model-pill"><i data-lucide="cpu" style="width:11px;height:11px"></i>deepseek-chat</span>
              <button class="send-btn" style="margin-left:auto" id="sendPromptBtn"><i data-lucide="arrow-up" style="width:14px;height:14px"></i></button>
            </div>
          </div><div class="prompt-help">Enter 发送 · Shift+Enter 换行</div></div>`;
        }
        if (a === "ask-context" || a === "ask-create" || a === "ask-confirm") {
          return `<div class="prompt-wrap"><div class="prompt-box" style="opacity:.55">
            <div class="prompt-area"><div class="prompt-text"><span class="ph">等待确认后继续…</span></div></div>
            <div class="prompt-foot">
              <span class="model-pill"><i data-lucide="cpu" style="width:11px;height:11px"></i>deepseek-chat</span>
              <button class="send-btn danger" style="margin-left:auto"><i data-lucide="square" style="width:12px;height:12px"></i></button>
            </div>
          </div><div class="prompt-help">Enter to steer · ⌘/Ctrl+Enter to follow up</div></div>`;
        }
        // default prompt (empty / restate / preview / tools / open-block / created-confirm / continue / idle)
        const busy = (a === "restate" || a === "tools" || a === "continue-investigate");
        const ph = a === "empty" ? "调查当前 Project…  输入 / 召出 Skill"
          : a === "idle-after" ? "继续调查…  写入 Graph ID / Node ID 后我可继续操作该 Graph"
          : a === "created-confirm" ? "继续调查…  在 Prompt 中写入 g_8a3f21"
          : "继续…";
        return `<div class="prompt-wrap"><div class="prompt-box">
          <div class="prompt-area"><div class="prompt-text"><span class="ph">${ph}</span></div></div>
          <div class="prompt-foot">
            <span class="model-pill"><i data-lucide="cpu" style="width:11px;height:11px"></i>deepseek-chat</span>
            <button class="send-btn ${busy ? "danger" : ""}" style="margin-left:auto" id="sendPromptBtn"><i data-lucide="${busy ? "square" : "arrow-up"}" style="width:14px;height:14px"></i></button>
          </div>
        </div><div class="prompt-help">${busy ? "Agent 运行中 · Enter to steer" : "Enter 发送 · Shift+Enter 换行"}</div></div>`;
      }

      function bindAgentEvents(a) {
        // Bind in both the main agent panel and the mirrored floating panel,
        // since the floating panel clones innerHTML (incl. ids) in focus mode.
        const bindAll = (id, fn) =>
          document.querySelectorAll("#" + id).forEach((node) => (node.onclick = fn));
        bindAll("askContextContinue", () => goTo(4));
        bindAll("askCreateContinue", () => goTo(5));
        bindAll("askConfirmContinue", () => goTo(7));
        bindAll("openGraphBtn", () => goTo(10));
        document.querySelectorAll("#sendPromptBtn").forEach((sp) => {
          sp.onclick = () => {
            if (a === "prompt-filled") goTo(3);
            else if (a === "empty") goTo(1);
            else if (a === "created-confirm") goTo(11);
            else if (a === "idle-after") toastInfo();
          };
        });
      }

      function toastInfo() {
        showToast("info", "sparkles", "在 Prompt 中写入 Graph ID 后我可继续操作该 Graph");
      }

      /* ---------------- Toast ---------------- */
      let toastTimer;
      function showToast(kind, icon, text) {
        clearTimeout(toastTimer);
        const old = el("protoToast");
        if (old) old.remove();
        const t = document.createElement("div");
        t.id = "protoToast";
        t.className = "toast " + kind;
        t.innerHTML = `<span class="ti"><i data-lucide="${icon}" style="width:13px;height:13px"></i></span>${text}`;
        document.body.appendChild(t);
        refreshIcons();
        toastTimer = setTimeout(() => t.remove(), 2200);
      }

      /* ---------------- Step driver ---------------- */
      function applyStep(idx) {
        state.stepIdx = idx;
        const step = STEPS[idx];
        // layout
        if (step.layout) state.layout = step.layout;
        applyLayout();
        // live pill
        const lp = el("livePill");
        lp.className = "live-pill" + (step.live === "warn" ? " warn" : step.live === "danger" ? " danger" : "");
        lp.innerHTML = `<span class="d"></span>${step.live === "warn" ? "Reconnecting…" : step.live === "danger" ? "Version gap · Resyncing" : "Realtime"}`;
        // breadcrumb
        el("crumbCur").textContent = step.crumb;
        // content screen
        if (step.screen === "list-empty") renderListEmpty();
        else if (step.screen === "list-populated") renderListPopulated();
        else if (step.screen === "detail-init") renderDetailInit();
        else if (step.screen === "detail-realtime") renderDetailRealtime();
        else if (step.screen === "detail-full") {
          if (step.live === "warn") renderDetailBanner("warn", "wifi-off", "Realtime 断开 · HTTP 仍可写入 · 正在重连…", 6);
          else if (step.live === "danger") renderDetailBanner("danger", "refresh-cw", "检测到版本缺口 · 正在重新同步 Snapshot…", 6);
          else renderDetailFull();
        }
        // drawer
        if (step.drawer) openDrawer(step.drawer);
        else closeDrawer();
        // agent
        renderAgent(step);
        // dock
        el("stepLabel").textContent = step.label;
        el("stepNum").textContent = `${idx + 1} / ${STEPS.length}`;
        el("prevBtn").disabled = idx === 0;
        el("nextBtn").disabled = idx === STEPS.length - 1;
        el("screenJump").value = step.key;
      }

      function goTo(idx) {
        idx = Math.max(0, Math.min(STEPS.length - 1, idx));
        applyStep(idx);
      }

      function applyLayout() {
        const mr = el("mainRegion");
        mr.classList.toggle("focus-content", state.layout === "focus");
        el("focusBtn").classList.toggle("active", state.layout === "focus");
        const icon = el("focusBtn").querySelector("i");
        if (icon) icon.setAttribute("data-lucide", state.layout === "focus" ? "minimize-2" : "maximize-2");
        // fab peek show only when running-ish and focus
        const fab = el("fab");
        fab.classList.toggle("idle", state.layout !== "focus");
        el("fabPeek").style.display = state.layout === "focus" ? "block" : "none";
        refreshIcons();
      }

      /* ---------------- Init & bindings ---------------- */
      function buildJumpSelect() {
        const sel = el("screenJump");
        sel.innerHTML = STEPS.map((s, i) => `<option value="${s.key}">${i + 1}. ${s.label}</option>`).join("");
        sel.onchange = () => {
          const i = STEPS.findIndex((s) => s.key === sel.value);
          if (i >= 0) applyStep(i);
        };
      }

      function bindGlobal() {
        el("prevBtn").onclick = () => goTo(state.stepIdx - 1);
        el("nextBtn").onclick = () => goTo(state.stepIdx + 1);
        el("layoutBtn").onclick = () => {
          state.layout = state.layout === "focus" ? "split" : "focus";
          applyLayout();
        };
        el("focusBtn").onclick = () => {
          state.layout = state.layout === "focus" ? "split" : "focus";
          applyLayout();
        };
        const toggleTheme = () => {
          state.theme = state.theme === "light" ? "dark" : "light";
          document.documentElement.classList.toggle("dark", state.theme === "dark");
          [el("themeToggle"), el("dockTheme")].forEach((b) => {
            const i = b.querySelector("i");
            if (i) i.setAttribute("data-lucide", state.theme === "dark" ? "sun" : "moon");
          });
          // redraw canvas edges (colors)
          const step = STEPS[state.stepIdx];
          applyStep(state.stepIdx);
          refreshIcons();
        };
        el("themeToggle").onclick = toggleTheme;
        el("dockTheme").onclick = toggleTheme;

        // splitter
        const sp = el("splitter");
        let dragging = false;
        sp.addEventListener("pointerdown", (e) => {
          if (state.layout === "focus") return;
          dragging = true;
          sp.classList.add("dragging");
          sp.setPointerCapture(e.pointerId);
        });
        sp.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          const rect = el("mainRegion").getBoundingClientRect();
          const share = Math.min(68, Math.max(38, ((e.clientX - rect.left) / rect.width) * 100));
          document.documentElement.style.setProperty("--content-share", share + "%");
        });
        sp.addEventListener("pointerup", () => {
          dragging = false;
          sp.classList.remove("dragging");
        });

        // floating agent
        el("fab").onclick = () => el("floatPanel").classList.toggle("open");
        el("closeFloat").onclick = () => el("floatPanel").classList.remove("open");

        // keyboard
        document.addEventListener("keydown", (e) => {
          if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
          if (e.key === "ArrowRight") goTo(state.stepIdx + 1);
          else if (e.key === "ArrowLeft") goTo(state.stepIdx - 1);
        });

        // nav buttons (non-explorer just show a toast)
        document.querySelectorAll("[data-nav]").forEach((b) => {
          if (b.dataset.nav !== "explorer") {
            b.onclick = () => showToast("info", "compass", "本交互稿仅覆盖 Explorer 模块");
          }
        });

        // relayout handler
        window.addEventListener("resize", () => {
          const step = STEPS[state.stepIdx];
          if (step.screen.startsWith("detail")) drawEdges(["q", "i", "f", "e", "c", "r"]);
        });
      }

      window.addEventListener("load", () => {
        buildJumpSelect();
        bindGlobal();
        applyStep(0);
        refreshIcons();
      });
    </script>
  </body>
</html>

services:
  migrate:
    image: ${TRACEABILITY_SERVER_IMAGE:-traceability-server:local}
    build:
      context: ..
      dockerfile: server/Dockerfile
    command: ["node", "dist/db/migrate.js"]
    environment: &server-environment
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-traceability}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-traceability}
      DATABASE_POOL_MAX: 10
      REDIS_URL: redis://redis:6379
      PUBLIC_INGEST_URL: ${PUBLIC_INGEST_URL:?PUBLIC_INGEST_URL must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-traceability-sourcemaps}
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp

  api:
    image: ${TRACEABILITY_SERVER_IMAGE:-traceability-server:local}
    build:
      context: ..
      dockerfile: server/Dockerfile
    command: ["node", "dist/app.js"]
    environment:
      <<: *server-environment
      PORT: 3000
      HOST: 0.0.0.0
    restart: unless-stopped
    ports:
      - "${TRACEABILITY_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-createbucket:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp

  dispatcher:
    image: ${TRACEABILITY_SERVER_IMAGE:-traceability-server:local}
    command: ["node", "dist/dispatcher.js"]
    environment: *server-environment
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp

  worker:
    image: ${TRACEABILITY_SERVER_IMAGE:-traceability-server:local}
    command: ["node", "dist/worker.js"]
    environment: *server-environment
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-traceability}
      POSTGRES_USER: ${POSTGRES_USER:-traceability}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-traceability} -d ${POSTGRES_DB:-traceability}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - traceability-postgres:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - traceability-redis:/data

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - traceability-minio:/data

  minio-createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set} ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set} &&
        mc mb --ignore-existing local/${OBJECT_STORAGE_BUCKET:-traceability-sourcemaps}
      "
    restart: "no"

volumes:
  traceability-postgres:
  traceability-redis:
  traceability-minio:

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: traceability
      POSTGRES_USER: traceability
      POSTGRES_PASSWORD: traceability
    ports:
      - "5432:5432"
    volumes:
      - traceability-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceability -d traceability"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  traceability-dev-postgres:

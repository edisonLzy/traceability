services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: traceability
      POSTGRES_USER: traceability
      POSTGRES_PASSWORD: traceability
    ports:
      - "5432:5432"
    volumes:
      - traceability-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceability -d traceability"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: traceability
      MINIO_ROOT_PASSWORD: traceability-development-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - traceability-dev-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 traceability traceability-development-secret &&
        mc mb --ignore-existing local/traceability-sourcemaps
      "
    restart: "no"

volumes:
  traceability-dev-postgres:
  traceability-dev-minio:

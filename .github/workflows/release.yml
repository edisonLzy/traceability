name: Release desktop app

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Create unique version
        shell: bash
        run: |
          BASE_VERSION=$(node -p "require('./app/package.json').version")
          MAJOR_MINOR=${BASE_VERSION%.*}
          VERSION="${MAJOR_MINOR}.${GITHUB_RUN_NUMBER}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run desktop app tests
        run: pnpm exec turbo run test --filter=@tracerability/app

  build:
    name: Build ${{ matrix.name }}
    needs:
      - version
      - validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            artifact: release-macos
          - name: Windows
            os: windows-latest
            artifact: release-windows
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set package version
        shell: bash
        working-directory: app
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version=process.env.RELEASE_VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
      - name: Build Electron bundles
        run: pnpm build:app
      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        working-directory: app
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          MAC_OPTIONS=(--mac --x64 --arm64 --publish never)

          if [[ -z "$CSC_LINK" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            MAC_OPTIONS+=(--config.mac.identity=-)
            MAC_OPTIONS+=(--config.mac.hardenedRuntime=false)
            MAC_OPTIONS+=(--config.mac.gatekeeperAssess=false)
          fi

          if [[ -n "${CSC_LINK:-}" && -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            MAC_OPTIONS+=(--config.mac.notarize=true)
          else
            MAC_OPTIONS+=(--config.mac.notarize=false)
          fi

          pnpm exec electron-builder "${MAC_OPTIONS[@]}"
      - name: Package Windows
        if: runner.os == 'Windows'
        working-directory: app
        run: pnpm exec electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/dist/*.dmg
            app/dist/*.exe
            app/dist/*.zip

  release:
    name: Publish GitHub release
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      - name: Publish release assets
        shell: bash
        run: |
          TAG="v${RELEASE_VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release-artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Traceability ${RELEASE_VERSION}" \
              --generate-notes
          fi

name: Publish CLI

on:
  push:
    branches:
      - master
    paths:
      - "packages/cli/src/**"
      - "packages/cli/package.json"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  release:
    name: Release @tracerability/cli
    # Skip when this push was made by release-it itself (version bump commit)
    # to prevent an infinite trigger loop.
    if: "!startsWith(github.event.head_commit.message, 'chore(cli): release')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - name: Build CLI (with monorepo dependencies)
        # Turbo resolves @tracerability/server#build first (CLI imports server tRPC types)
        run: pnpm turbo run build --filter=@tracerability/cli
        env:
          VITE_MANAGEMENT_TOKEN: ci-placeholder

      - name: Release
        id: release
        working-directory: packages/cli
        run: pnpm exec release-it --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.release.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          TAG="@tracerability/cli@${VERSION}"
          NOTES=$(cd packages/cli && node -e "
            const fs = require('fs');
            const log = fs.readFileSync('CHANGELOG.md', 'utf8');
            const match = log.match(/## [\s\S]+?(?=\n## |\$)/);
            process.stdout.write(match ? match[0] : '');
          ")
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "@tracerability/cli v${VERSION}" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA"
